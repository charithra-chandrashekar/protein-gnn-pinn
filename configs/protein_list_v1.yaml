# Phase 0 pilot protein list (~15 proteins)
# Source of truth for verification + curation.
#
# Schema per entry:
#   uniprot_id      : UniProt accession — anchor identity key (used later to join
#                      variant databases like ClinVar/gnomAD in Phase 6)
#   gene_name       : common gene symbol, for human readability
#   pdb_id          : expected PDB/mmCIF entry ID
#   chain           : expected chain ID to extract
#   family          : rough functional family, for dataset balance checks
#   max_resolution  : quality bar in Angstrom (entry fails validation above this)
#   expect_ligand   : if true, structure must contain at least one non-water HETATM
#                      ligand group (i.e. this should NOT be an apo structure)
#   min_residues    : minimum polymer residue count expected in the chain
#                      (catches truncated / wrong-chain downloads)
#   notes           : why this protein was chosen / future relevance
#
# NOTE: pdb_id / chain / resolution values below are starting points based on
# well-known literature structures. The verification script cross-checks each
# against the actual downloaded .cif — treat mismatches as signals to re-check
# the PDB entry, not as script bugs.

proteins:
  - uniprot_id: P00533
    gene_name: EGFR
    pdb_id: 1M17
    chain: A
    family: kinase
    max_resolution: 2.6
    expect_ligand: true
    min_residues: 250
    notes: "Canonical kinase-inhibitor complex (erlotinib)"

  - uniprot_id: P00519
    gene_name: ABL1
    pdb_id: 2HYY
    chain: A
    family: kinase
    max_resolution: 2.6
    expect_ligand: true
